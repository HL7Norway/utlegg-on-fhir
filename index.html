<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utlegg on FHIR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" rel="stylesheet">
  <style>.CodeMirror { height: 420px; border: 1px solid #dee2e6; font-size: 13px; }</style>
</head>
<body>
<main class="container-fluid py-4">
  <h1 class="h3 mb-3">Utlegg on FHIR</h1>
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="d-flex align-items-center gap-2 mb-2">
        <h2 class="h6 mb-0">FHIR Claim (JSON)</h2>
        <select id="source-select" class="form-select form-select-sm w-auto" aria-label="Example claim"></select>
      </div>
      <textarea id="claim-json"></textarea>
      <div class="mt-3">
        <label for="attachments" class="form-label h6">Attachments (receipts: PDF or images)</label>
        <input id="attachments" class="form-control form-control-sm" type="file" multiple accept="application/pdf,image/*">
        <ul id="attachment-list" class="list-group list-group-flush mt-2"></ul>
      </div>
      <div class="my-3 d-flex gap-2">
        <button id="generate" class="btn btn-primary" type="button">Generate PDF</button>
        <button id="download" class="btn btn-outline-primary" type="button">Download PDF</button>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert" style="white-space: pre-wrap"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h6">PDF preview</h2>
      <iframe id="preview" class="w-100 border rounded bg-white" style="height: 560px" title="PDF preview"></iframe>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="js/claim-pdf.js"></script>
<script src="js/attachments.js"></script>
<script src="js/app.js"></script>
</body>
</html>
